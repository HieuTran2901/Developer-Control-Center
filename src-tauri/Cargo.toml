[package]
name = "developer-control-center"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "developer-control-center"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "developer_control_center_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ignore = "0.4"


tokio = { version = "1", features = ["process", "rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }
tauri-plugin-dialog = "2"
sysinfo = "0.39.6"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["json", "rustls"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
keyring = "2.1.0"
uuid = { version = "1.24.0", features = ["v4"] }
url = "2.5.8"
sha2 = "0.10"
base64 = "0.22"
async-trait = "0.1.92"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security"
] }
